<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Maths Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ff;color:#171c45;font:15px system-ui}header{background:linear-gradient(110deg,#1a2d62,#303f83);color:white;padding:16px 25px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}h1{margin:0;font-size:30px}header small{color:#d8dffa}nav button,.primary{background:#6651ca;color:white;border:0}button{cursor:pointer;padding:10px 13px;border:1px solid #dad8e9;background:white;border-radius:8px;font-weight:650;color:#37316e}nav{display:flex;gap:8px}main{display:grid;grid-template-columns:220px minmax(350px,1fr) 270px;gap:15px;padding:18px;max-width:1650px;margin:auto}.panel{background:white;border-radius:14px;overflow:hidden;box-shadow:0 3px 15px #0001}.panel h2{background:#6053bd;color:white;padding:13px 16px;margin:0;font-size:19px}.body{padding:14px}.topic{display:block;width:100%;text-align:left;border:0;margin:4px 0}.topic.on{background:#e9e6ff;color:#3d31a5}svg{width:100%;touch-action:none}.sliders{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ctrl{display:flex;align-items:center;gap:6px;font-size:13px}.ctrl input[type=range]{width:100%;accent-color:#6750cf}.ctrl output{min-width:28px}.result{padding:12px;margin-top:12px;background:#f9effa;border-radius:10px;line-height:1.8}input.answer{width:100%;padding:10px;border:1px solid #d2d1e0;border-radius:7px;margin:12px 0}#feedback{margin-top:12px;padding:12px;border-radius:8px;display:none}footer{background:#ece8ff;padding:15px 25px;display:flex;gap:10px;flex-wrap:wrap}@media(max-width:1100px){main{grid-template-columns:190px 1fr}#practice{grid-column:1/-1}}@media(max-width:650px){main{grid-template-columns:1fr}.sliders{grid-template-columns:1fr}#practice{grid-column:auto}}
</style><header><div><h1>▶ Interactive Maths Lab</h1><small>Explore • Manipulate • Discover • Answer</small></div><nav><button onclick="location.href='/'">Home</button><button onclick="selectMode('add')">Vectors</button><button onclick="selectMode('circle')">Circles</button><button onclick="selectMode('triangle')">Visuals</button><button onclick="selectMode('quiz')">Quizzes</button></nav></header><main><aside class="panel"><h2>Topics</h2><div class="body" id="topics"></div></aside><section class="panel"><h2 id="title">Vector addition</h2><div class="body"><svg id="plot" viewBox="0 0 660 490"></svg><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" onclick="animate()">▶ Animate</button><button onclick="reset()">↺ Reset</button><label><input type="checkbox" id="grid" checked onchange="draw()"> Grid</label><label><input type="checkbox" id="components" onchange="draw()"> Components</label></div><p style="font-size:13px;color:#666">Drag vector endpoints or the point on the circle to explore.</p><div class="sliders" id="sliders"></div><div class="result" id="result"></div></div></section><aside class="panel" id="practice"><h2>◎ Practice</h2><div class="body"><strong id="question"></strong><input class="answer" id="answer" placeholder="Enter answer"><button class="primary" onclick="check()">✓ Check Answer</button> <button onclick="question()">Next</button><div id="feedback"></div><p style="color:#777;font-size:12px">Enter vectors as x, y. Round numerical answers to 2 decimal places.</p></div></aside></main><footer><b>🚀 Quick Explore</b><button onclick="selectMode('add')">Vector Addition</button><button onclick="selectMode('dot')">Scalar Product</button><button onclick="selectMode('circle')">Radians</button><button onclick="selectMode('arc')">Arc Length</button><button onclick="selectMode('sector')">Sector Area</button></footer><script>
let mode='add',a=[3,1],b=[1,3],k=2,r=4,deg=90,drag='',qnum=0,expected='',progress=1;const $=id=>document.getElementById(id),S=37,O=[325,250],F=n=>+n.toFixed(3),V=v=>'('+v.map(F).join(', ')+')',M=v=>Math.hypot(...v),D=(x,y)=>x[0]*y[0]+x[1]*y[1],xy=v=>[O[0]+S*v[0],O[1]-S*v[1]],modes={add:'Vector addition & subtraction',scale:'Scalar multiples',magnitude:'Magnitude & direction',dot:'Scalar product & projection',position:'Position vectors',circle:'Radians & degrees',arc:'Arc length',sector:'Sector area',triangle:'Triangle geometry',quiz:'Mixed challenges'};
function selectMode(m){mode=m;progress=1;render()}function reset(){a=[3,1];b=[1,3];k=2;r=4;deg=90;render()}function render(){$('topics').innerHTML=[['Vectors',['add','scale','magnitude','position','dot']],['Circles',['circle','arc','sector']],['Visuals & Geometry',['triangle']],['Quizzes',['quiz']]].map(([h,ms])=>'<h3>'+h+'</h3>'+ms.map(m=>'<button class="topic '+(mode===m?'on':'')+'" onclick="selectMode(\''+m+'\')">'+modes[m]+'</button>').join('')).join('');$('title').textContent=modes[mode];sliders();draw();question()}
function slider(id,label,val,min,max,step){return '<div class="ctrl"><b>'+label+'</b><input type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'" oninput="change(\''+id+'\',this.value)"><output>'+F(val)+'</output></div>'}
function sliders(){let c=['circle','arc','sector'].includes(mode);$('sliders').innerHTML=c?slider('r','Radius',r,.5,6,.1)+slider('deg','Angle °',deg,0,360,1):slider('ax','aₓ',a[0],-6,6,.5)+slider('ay','aᵧ',a[1],-6,6,.5)+slider('bx','bₓ',b[0],-6,6,.5)+slider('by','bᵧ',b[1],-6,6,.5)+(mode==='scale'?slider('k','Scalar',k,-3,3,.1):'')}
function change(id,v){v=+v;if(id==='ax')a[0]=v;if(id==='ay')a[1]=v;if(id==='bx')b[0]=v;if(id==='by')b[1]=v;if(id==='k')k=v;if(id==='r')r=v;if(id==='deg')deg=v;sliders();draw()}
const L=(x,y,X,Y,c='#ddd',w=1,d='')=>'<line x1="'+x+'" y1="'+y+'" x2="'+X+'" y2="'+Y+'" stroke="'+c+'" stroke-width="'+w+'" stroke-dasharray="'+d+'"/>',T=(x,y,t,c='#262b4e')=>'<text x="'+x+'" y="'+y+'" fill="'+c+'" font-size="16" font-weight="600">'+t+'</text>';
function arrow(v,color,label,id){let [x,y]=xy(v.map(z=>z*progress)),dx=x-O[0],dy=y-O[1],n=Math.hypot(dx,dy)||1,ux=dx/n,uy=dy/n;return L(...O,x,y,color,3)+'<polygon points="'+x+','+y+' '+(x-12*ux-6*uy)+','+(y-12*uy+6*ux)+' '+(x-12*ux+6*uy)+','+(y-12*uy-6*ux)+'" fill="'+color+'"/><circle data-drag="'+id+'" cx="'+x+'" cy="'+y+'" r="11" fill="'+color+'" fill-opacity=".25" stroke="'+color+'" style="cursor:grab"/>'+T(x+9,y-12,label,color)}
function draw(){let h='';if($('grid').checked)for(let i=-9;i<=9;i++)h+=L(O[0]+i*S,15,O[0]+i*S,475,'#e7e8ef')+L(15,O[1]+i*S,645,O[1]+i*S,'#e7e8ef');h+=L(10,O[1],650,O[1],'#333',2)+L(O[0],10,O[0],480,'#333',2)+T(640,O[1]-12,'x')+T(O[0]+9,23,'y');for(let i=-8;i<=8;i++)if(i)h+=T(O[0]+i*S-5,O[1]+18,''+i,'#9296a8')+T(O[0]+7,O[1]-i*S+5,''+i,'#9296a8');let res='';if(['circle','arc','sector'].includes(mode)){let t=deg*Math.PI/180,R=r*S,P=[O[0]+R*Math.cos(t),O[1]-R*Math.sin(t)];h+='<circle cx="'+O[0]+'" cy="'+O[1]+'" r="'+R+'" fill="#f0e8fd" stroke="#7054cb" stroke-width="2"/>';if(deg>0&&deg<360)h+='<path d="M '+O.join(' ')+' L '+(O[0]+R)+' '+O[1]+' A '+R+' '+R+' 0 '+(deg>180?1:0)+' 0 '+P.join(' ')+' Z" fill="#e3c9f8" stroke="#ad7ed5" stroke-width="2"/>';h+=L(...O,O[0]+R,O[1],'#5146cc',3)+L(...O,...P,'#d63287',3)+'<circle data-drag="angle" cx="'+P[0]+'" cy="'+P[1]+'" r="11" fill="#d63287" style="cursor:grab"/>'+T(P[0]+8,P[1]-8,'P','#d63287');res='<b>θ = '+deg+'° = '+F(t)+' radians = '+F(deg/180)+'π radians</b><br>Arc length: s = rθ = '+F(r*t)+'<br>Sector area: A = ½r²θ = '+F(r*r*t/2)+'<br>Chord length: 2r sin(θ/2) = '+F(2*r*Math.sin(t/2));}else{let sum=a.map((x,i)=>x+b[i]),diff=a.map((x,i)=>x-b[i]);h+=arrow(a,'#2855e8','a = '+V(a),'a');if(!['position','magnitude'].includes(mode))h+=arrow(b,'#499632','b = '+V(b),'b');if(['add','quiz'].includes(mode)){h+=arrow(sum,'#e62e83','a+b = '+V(sum),'none');h+=L(...xy(a),...xy(sum),'#aaa',2,'5 5')+L(...xy(b),...xy(sum),'#aaa',2,'5 5')}if(mode==='scale')h+=arrow(a.map(x=>x*k),'#e62e83','ka = '+V(a.map(x=>x*k)),'none');if(mode==='dot'){let f=D(a,b)/(D(a,a)||1),p=xy(a.map(x=>x*f));h+=L(...xy(b),...p,'#bd6bad',2,'5 5')}if($('components').checked)for(let v of [a,b]){let p=xy(v);h+=L(p[0],p[1],p[0],O[1],'#aaa',1,'4 4')+L(p[0],p[1],O[0],p[1],'#aaa',1,'4 4')}let cos=Math.max(-1,Math.min(1,D(a,b)/(M(a)*M(b)||1)));res='<b>a = '+V(a)+'; b = '+V(b)+'</b><br>a + b = '+V(sum)+'; a − b = '+V(diff)+'<br>|a| = '+F(M(a))+'; |a+b| = '+F(M(sum))+'<br>a · b = '+F(D(a,b))+' = |a||b| cos φ<br>Angle between a and b = '+F(Math.acos(cos)*180/Math.PI)+'°<br>Projection of b onto a = '+V(a.map(x=>x*D(a,b)/(D(a,a)||1)))+'<br>Direction of a = '+F((Math.atan2(a[1],a[0])*180/Math.PI+360)%360)+'°';if(mode==='triangle'){h+='<polygon points="'+[xy([0,0]),xy(a),xy(b)].map(p=>p.join(',')).join(' ')+'" fill="#a48be0" fill-opacity=".25" stroke="#7c54bd" stroke-width="2"/>';res+='<br>Triangle area = ½|aₓbᵧ − aᵧbₓ| = '+F(Math.abs(a[0]*b[1]-a[1]*b[0])/2)}}$('plot').innerHTML=h;$('result').innerHTML=res}
const svg=$('plot');svg.addEventListener('pointerdown',e=>{drag=e.target.dataset.drag||'';if(drag)svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;let z=p.matrixTransform(svg.getScreenCTM().inverse()),x=(z.x-O[0])/S,y=(O[1]-z.y)/S;if(drag==='a')a=[Math.round(x*2)/2,Math.round(y*2)/2];if(drag==='b')b=[Math.round(x*2)/2,Math.round(y*2)/2];if(drag==='angle'){deg=Math.round((Math.atan2(y,x)*180/Math.PI+360)%360);r=Math.max(.5,Math.min(6,Math.round(Math.hypot(x,y)*10)/10))}sliders();draw()});svg.addEventListener('pointerup',()=>drag='');svg.addEventListener('pointercancel',()=>drag='');
function animate(){progress=0;let start=performance.now();function tick(t){progress=Math.min(1,(t-start)/900);draw();if(progress<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)}
function question(){let circ=['circle','arc','sector'].includes(mode),qs=circ?[['Convert '+deg+'° into radians (decimal)',deg*Math.PI/180],['Calculate the arc length',r*deg*Math.PI/180],['Calculate the sector area',r*r*deg*Math.PI/360]]:mode==='dot'?[['Calculate a · b',D(a,b)],['Calculate the magnitude of a',M(a)]]:mode==='scale'?[['Calculate k a',V(a.map(x=>x*k))]]:[['Calculate a + b',V(a.map((x,i)=>x+b[i]))],['Calculate a − b',V(a.map((x,i)=>x-b[i]))],['Calculate |a + b|',M(a.map((x,i)=>x+b[i]))]];let q=qs[qnum++%qs.length];$('question').textContent='Q. '+q[0];expected=q[1];$('feedback').style.display='none';$('answer').value=''}
function check(){let raw=$('answer').value,ok=false;if(typeof expected==='number'){let v=Number(raw);ok=raw.trim()!==''&&Math.abs(v-expected)<Math.max(.02,Math.abs(expected)*.002)}else{let nums=raw.match(/-?\d+(?:\.\d+)?/g)?.map(Number)||[],target=expected.match(/-?\d+(?:\.\d+)?/g).map(Number);ok=nums.length===target.length&&nums.every((n,i)=>Math.abs(n-target[i])<.02)}$('feedback').style.display='block';$('feedback').style.background=ok?'#e9f6e5':'#fff0f0';$('feedback').innerHTML=ok?'✓ Correct!':'Correct answer: <b>'+expected+'</b>. Compare your work with the diagram.'}
render();
</script></html>
